<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050f">
<link rel="manifest" href="manifest.json">
<title>NEON RIFT V2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:#05050f; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; font-family:'Courier New',monospace; }
canvas { display:block; position:fixed; top:0; left:0; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let CW, CH;
function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));

// ── Global ───────────────────────────────────────────────────────────────────
let STATE = 'menu'; // menu | slot | rpg
let gNow = 0, gDt = 0, gLast = 0;

// ── Palette ──────────────────────────────────────────────────────────────────
const C = {
  bg:'#05050f', panel:'#0a0a1e', border:'#2a1a4a',
  kira:'#ff3070', kiraG:'#ff70a0',
  dante:'#9040ff', danteG:'#b880ff',
  nova:'#20c8ff', novaG:'#60d8ff',
  gold:'#ffc040', goldG:'#ffe090',
  white:'#d0dcff', dim:'#3a3a5a',
};
const CHARS = [
  { name:'KIRA',  role:'COMBATTANTE', col:C.kira,  glow:C.kiraG  },
  { name:'DANTE', role:'LE BOSS',     col:C.dante, glow:C.danteG },
  { name:'NOVA',  role:'ANDROÏDE',    col:C.nova,  glow:C.novaG  },
];
let selChar = 0;

// ── City buildings (generated once) ─────────────────────────────────────────
const BLDS = [];
(function(){
  const neonPalette = [C.kira,C.dante,C.nova,C.gold,'#ff8040'];
  let x = 0;
  while(x < 1400){
    const w = 40 + Math.random()*90;
    const h = 70 + Math.random()*280;
    BLDS.push({
      rx: x/1400, w, h,
      dark:`hsl(${220+Math.random()*30},45%,${5+Math.random()*7}%)`,
      neon: neonPalette[Math.floor(Math.random()*neonPalette.length)],
      winRows: 2+Math.floor(Math.random()*6),
      winCols: 1+Math.floor(Math.random()*4),
      hasSign: Math.random()>0.5,
    });
    x += w + 5 + Math.random()*15;
  }
})();

// ── Rain ─────────────────────────────────────────────────────────────────────
const RAIN = Array.from({length:120}, ()=>({
  x: Math.random(), y: Math.random(),
  spd: 0.25+Math.random()*0.5,
  len: 6+Math.random()*22,
  col: Math.random()>0.5 ? C.nova : C.dante,
  a: 0.08+Math.random()*0.22,
}));

// ── Helpers ──────────────────────────────────────────────────────────────────
function neonText(txt, x, y, sz, col, blur=18, align='center') {
  ctx.save();
  ctx.font = `bold ${sz}px 'Courier New',monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = col; ctx.shadowBlur = blur;
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
  ctx.shadowBlur = blur*0.35; ctx.fillStyle = '#ffffff';
  ctx.fillText(txt, x, y);
  ctx.restore();
}
function rRect(x,y,w,h,r,fill,stroke,blur,blurC){
  ctx.save();
  if(blur){ctx.shadowColor=blurC||stroke; ctx.shadowBlur=blur;}
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill; ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke();}
  ctx.restore();
}
function inBox(x,y,b){ return b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h; }

// ── Draw city background ─────────────────────────────────────────────────────
function drawCity(alpha=1) {
  ctx.save(); ctx.globalAlpha = alpha;
  // Sky
  const sky = ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#03030c'); sky.addColorStop(0.65,'#08041a'); sky.addColorStop(1,'#12082a');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH);
  // Scan lines
  ctx.globalAlpha=alpha*0.025; ctx.fillStyle='#fff';
  for(let y=0;y<CH;y+=3) ctx.fillRect(0,y,CW,1);
  ctx.globalAlpha=alpha;
  const gY = CH*0.7;
  // Buildings
  for(const b of BLDS){
    const bx=b.rx*CW*1.4; const bw=b.w*(CW/500); const bh=b.h*(CH/700);
    const by=gY-bh;
    ctx.fillStyle=b.dark; ctx.fillRect(bx,by,bw,bh);
    // Windows
    for(let r=0;r<b.winRows;r++){
      for(let c=0;c<b.winCols;c++){
        const wlit=Math.sin(gNow*0.4+bx*0.03+r*5.1+c*2.7)>0.15;
        if(wlit){
          const wx=bx+c*(bw/b.winCols)+2, wy=by+r*(bh/(b.winRows+1))+8;
          ctx.save(); ctx.shadowColor=b.neon; ctx.shadowBlur=5;
          ctx.globalAlpha=alpha*(0.3+0.25*Math.sin(gNow*0.6+r+c));
          ctx.fillStyle=b.neon; ctx.fillRect(wx,wy,bw/b.winCols-4,8);
          ctx.restore();
        }
      }
    }
    // Neon sign
    if(b.hasSign){
      ctx.save(); ctx.shadowColor=b.neon; ctx.shadowBlur=6+3*Math.sin(gNow*1.8+bx);
      ctx.strokeStyle=b.neon; ctx.lineWidth=2; ctx.globalAlpha=alpha*0.65;
      ctx.strokeRect(bx+bw*0.1,by+bh*0.1,bw*0.8,12);
      ctx.restore();
    }
  }
  // Ground glow
  const gg=ctx.createLinearGradient(0,gY,0,CH);
  gg.addColorStop(0,'rgba(120,30,220,0.18)'); gg.addColorStop(0.4,'rgba(0,160,255,0.08)'); gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg; ctx.fillRect(0,gY,CW,CH-gY);
  // Rain
  for(const r of RAIN){
    const rx=r.x*CW, ry=((r.y+gNow*r.spd*0.07)%1)*CH;
    ctx.save(); ctx.globalAlpha=r.a*alpha; ctx.strokeStyle=r.col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-1,ry+r.len); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ── Draw character silhouette ────────────────────────────────────────────────
function drawCharFig(ch, cx, cy, sz, sel) {
  const col = sel ? ch.col : C.dim;
  const glw = sel ? ch.glow : C.dim;
  ctx.save(); ctx.shadowColor=glw; ctx.shadowBlur=sel?25:8;
  ctx.fillStyle=col;
  // Head
  ctx.beginPath(); ctx.arc(cx, cy-sz*0.38, sz*0.16, 0, Math.PI*2); ctx.fill();
  // Torso
  ctx.fillRect(cx-sz*0.13, cy-sz*0.22, sz*0.26, sz*0.38);
  // Legs
  ctx.fillRect(cx-sz*0.13, cy+sz*0.16, sz*0.11, sz*0.28);
  ctx.fillRect(cx+sz*0.02, cy+sz*0.16, sz*0.11, sz*0.28);
  // Char-specific
  if(ch.name==='KIRA'){
    ctx.fillStyle=sel?'#ff8090':C.dim;
    ctx.fillRect(cx-sz*0.32, cy-sz*0.08, sz*0.17, sz*0.06);
    ctx.fillRect(cx+sz*0.15, cy-sz*0.08, sz*0.17, sz*0.06);
  } else if(ch.name==='DANTE'){
    ctx.globalAlpha=0.55; ctx.fillStyle=sel?ch.glow:C.dim;
    ctx.beginPath();
    ctx.moveTo(cx-sz*0.13,cy-sz*0.22); ctx.lineTo(cx-sz*0.32,cy+sz*0.38);
    ctx.lineTo(cx+sz*0.32,cy+sz*0.38); ctx.lineTo(cx+sz*0.13,cy-sz*0.22);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=sel?C.gold:C.dim;
    ctx.fillRect(cx-sz*0.04,cy-sz*0.18,sz*0.08,sz*0.22);
  } else {
    ctx.fillStyle=sel?col:C.dim;
    ctx.fillRect(cx-sz*0.19,cy-sz*0.55,sz*0.38,sz*0.28);
    ctx.fillStyle=sel?ch.glow:C.dim; ctx.shadowBlur=sel?12:0;
    ctx.fillRect(cx-sz*0.15,cy-sz*0.46,sz*0.30,sz*0.09);
    ctx.strokeStyle=sel?ch.glow:C.dim; ctx.lineWidth=sz*0.04;
    ctx.beginPath(); ctx.moveTo(cx,cy-sz*0.55); ctx.lineTo(cx,cy-sz*0.68); ctx.stroke();
    ctx.fillStyle=sel?C.gold:C.dim;
    ctx.beginPath(); ctx.arc(cx,cy-sz*0.7,sz*0.05,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  neonText(ch.name, cx, cy+sz*0.62, sz*0.21, sel?col:C.dim, sel?14:3);
  neonText(ch.role, cx, cy+sz*0.78, sz*0.13, sel?glw:'#2a2a4a', sel?7:0);
}

// ── MENU ─────────────────────────────────────────────────────────────────────
let mBtnSlot=null, mBtnRpg=null, mBtnChars=[];

function drawMenu() {
  drawCity();
  // Title
  const tY=CH*0.1;
  neonText('NEON RIFT', CW/2, tY, Math.min(CW*0.13,60), C.nova, 35);
  neonText('V2', CW/2, tY+Math.min(CW*0.072,40), Math.min(CW*0.052,24), C.dante, 18);
  // Chars
  const cW=CW/3, cY=CH*0.42, cSz=Math.min(cW*0.48,CH*0.21,88);
  mBtnChars=[];
  for(let i=0;i<3;i++){
    const cx=cW*i+cW/2, sel=i===selChar;
    const bx=cx-cSz*0.82, by=cY-cSz*0.9, bw=cSz*1.64, bh=cSz*1.95;
    rRect(bx,by,bw,bh,10,
      sel?'rgba(20,10,45,0.9)':'rgba(8,5,18,0.6)',
      sel?CHARS[i].col:C.border, sel?16:4, sel?CHARS[i].glow:C.border);
    drawCharFig(CHARS[i],cx,cY,cSz,sel);
    mBtnChars.push({x:bx,y:by,w:bw,h:bh,idx:i});
  }
  // Pulse hint
  ctx.save(); ctx.globalAlpha=0.4+0.12*Math.sin(gNow*2);
  neonText('Choisis ton personnage', CW/2, CH*0.7, Math.min(CW*0.036,14), C.white, 5);
  ctx.restore();
  // Buttons
  const bW=Math.min(CW*0.4,200), bH=Math.min(CH*0.078,56), bY=CH*0.79, gap=CW*0.04;
  const sx=CW/2-bW-gap/2, rx=CW/2+gap/2;
  rRect(sx,bY,bW,bH,14,'rgba(255,48,112,0.14)',C.kira,12,C.kiraG);
  neonText('🎰  SLOT', sx+bW/2, bY+bH/2, Math.min(bH*0.4,18), C.kira, 12);
  rRect(rx,bY,bW,bH,14,'rgba(144,64,255,0.14)',C.dante,12,C.danteG);
  neonText('⚔  ACTION RPG', rx+bW/2, bY+bH/2, Math.min(bH*0.38,17), C.dante, 12);
  mBtnSlot={x:sx,y:bY,w:bW,h:bH}; mBtnRpg={x:rx,y:bY,w:bW,h:bH};
}

function menuTouch(x,y){
  for(const b of mBtnChars){ if(inBox(x,y,b)){selChar=b.idx;return;} }
  if(inBox(x,y,mBtnSlot)){startSlot();return;}
  if(inBox(x,y,mBtnRpg)){startRPG();return;}
}

// ── SLOT MACHINE ─────────────────────────────────────────────────────────────
const SYMS=[
  {id:'KIRA',   col:C.kira,  glow:C.kiraG,  lbl:'K'},
  {id:'DANTE',  col:C.dante, glow:C.danteG, lbl:'D'},
  {id:'NOVA',   col:C.nova,  glow:C.novaG,  lbl:'N'},
  {id:'WILD',   col:C.gold,  glow:C.goldG,  lbl:'W'},
  {id:'SCATTER',col:'#fff',  glow:'#fff',   lbl:'★'},
  {id:'SEVEN',  col:C.gold,  glow:C.goldG,  lbl:'7'},
  {id:'NEON',   col:C.nova,  glow:C.novaG,  lbl:'≡'},
];
const SWGT=[15,15,15,8,6,10,15];
const SPAY={WILD:1000,DANTE:500,KIRA:300,NOVA:200,SEVEN:150,SCATTER:100,NEON:80};
const NREELS=3, NROWS=3;
let sCredits, sBet, sSpinning, sReels, sTargets;
let sSpinStart, sSpinDur, sOffsets, sWins, sWinAmt, sWinTimer;
let sMsg, sMsgTimer, sBonus, sBonusSpins, sTapes;
let sBtnSpin=null, sBtnBack=null, sBtnMinus=null, sBtnPlus=null;

function swrand(){
  const tot=SWGT.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<SWGT.length;i++){r-=SWGT[i];if(r<=0)return i;}
  return SYMS.length-1;
}
function initSlot(){
  sCredits=1000; sBet=10; sSpinning=false;
  sReels=Array.from({length:NREELS},()=>Array.from({length:NROWS},()=>swrand()));
  sTargets=sReels.map(r=>[...r]);
  sOffsets=[0,0,0]; sWins=[]; sWinAmt=0; sWinTimer=0;
  sMsg=''; sMsgTimer=0; sBonus=false; sBonusSpins=0;
  sTapes=Array.from({length:NREELS},()=>Array.from({length:20},()=>swrand()));
}
function spinSlot(){
  if(sSpinning)return;
  if(!sBonus&&sCredits<sBet){sMsg='CRÉDITS INSUFFISANTS';sMsgTimer=2;return;}
  if(!sBonus) sCredits-=sBet;
  sSpinning=true; sSpinStart=gNow; sWins=[]; sWinAmt=0; sWinTimer=0; sMsg='';
  sSpinDur=[0.7,0.95,1.2];
  sTargets=Array.from({length:NREELS},()=>Array.from({length:NROWS},()=>swrand()));
  sTapes=Array.from({length:NREELS},()=>Array.from({length:20},()=>swrand()));
  sOffsets=[0,0,0];
}
function updateSlot(){
  if(!sSpinning)return;
  const elapsed=gNow-sSpinStart;
  let done=true;
  for(let r=0;r<NREELS;r++){
    if(elapsed<sSpinDur[r]){
      done=false;
      const t=elapsed/sSpinDur[r];
      const spd=(1-t*t*t)*900+60;
      sOffsets[r]=(sOffsets[r]+spd*gDt);
    } else { sOffsets[r]=0; sReels[r]=[...sTargets[r]]; }
  }
  if(done){ sSpinning=false; checkWins(); }
}
function checkWins(){
  sWins=[]; sWinAmt=0; let scatters=0;
  for(let r=0;r<NREELS;r++) for(let row=0;row<NROWS;row++)
    if(SYMS[sReels[r][row]].id==='SCATTER') scatters++;
  for(let row=0;row<NROWS;row++){
    const ids=sReels.map(reel=>SYMS[reel[row]].id);
    const base=ids.find(s=>s!=='WILD')||'WILD';
    if(ids.every(s=>s===base||s==='WILD')){
      const pay=(SPAY[base]||0)*(sBonus?3:1);
      if(pay>0){sWins.push({row,pay,sym:base});sWinAmt+=pay;}
    }
  }
  if(scatters>=3&&!sBonus){ sBonus=true; sBonusSpins=10; sMsg='✦ BONUS! 10 FREE SPINS ✦'; sMsgTimer=3; }
  if(sWinAmt>0){ sCredits+=sWinAmt; sWinTimer=2.5; }
  if(sBonus){ sBonusSpins--; if(sBonusSpins<=0){sBonus=false;sMsg='FIN DU BONUS';sMsgTimer=2;} }
}
function drawSym(sym,cx,cy,sz){
  ctx.save();
  ctx.fillStyle=sym.col+'22'; ctx.shadowColor=sym.glow; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.roundRect(cx-sz*0.58,cy-sz*0.58,sz*1.16,sz*1.16,8); ctx.fill();
  ctx.fillStyle=sym.col; ctx.shadowBlur=15;
  ctx.font=`bold ${sz*0.88}px 'Courier New',monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(sym.lbl,cx,cy);
  ctx.font=`${sz*0.26}px 'Courier New',monospace`;
  ctx.fillStyle=sym.glow; ctx.shadowBlur=5;
  ctx.fillText(sym.id,cx,cy+sz*0.64);
  ctx.restore();
}
function drawSlot(){
  drawCity(0.45);
  const cc=CHARS[selChar];
  const SW=Math.min(CW*0.96,430), SH=Math.min(CH*0.92,600);
  const sx=(CW-SW)/2, sy=(CH-SH)/2-CH*0.01;
  rRect(sx,sy,SW,SH,20,'rgba(4,4,20,0.97)',cc.col,18,cc.glow);
  // Title bar
  rRect(sx+10,sy+10,SW-20,46,10,'rgba(18,8,38,0.95)',cc.col,8,cc.col);
  neonText('NEON RIFT SLOTS',CW/2,sy+33,Math.min(SW*0.068,22),cc.col,14);
  // Credits/bet
  const iY=sy+68;
  neonText(`CRÉDITS: ${sCredits}`,sx+SW*0.28,iY,13,C.gold,8);
  neonText(`MISE: ${sBet}`,sx+SW*0.78,iY,13,C.white,5);
  if(sBonus) neonText(`FREE SPINS: ${sBonusSpins}`,CW/2,iY+20,13,C.kira,10);
  // Reel area
  const raX=sx+14, raY=sy+96, raW=SW-28, raH=Math.min(SH*0.5,280);
  const cW=raW/NREELS, cH=raH/NROWS;
  rRect(raX,raY,raW,raH,8,'#060616','#1a1a3a',0);
  for(let r=0;r<NREELS;r++){
    const rx=raX+r*cW;
    ctx.save();
    ctx.beginPath(); ctx.rect(rx+2,raY+2,cW-4,raH-4); ctx.clip();
    const off=sOffsets[r]%(cH);
    for(let row=-1;row<=NROWS+1;row++){
      let si;
      if(sSpinning){ const ti=Math.floor((sOffsets[r]/cH+row)%sTapes[r].length+sTapes[r].length)%sTapes[r].length; si=sTapes[r][ti]||0; }
      else { si=sReels[r][(row%NROWS+NROWS)%NROWS]; }
      const cellY=raY+row*cH+off;
      if(cellY>raY-cH&&cellY<raY+raH+cH) drawSym(SYMS[si||0],rx+cW/2,cellY+cH/2,Math.min(cW,cH)*0.5);
    }
    ctx.restore();
    if(r<NREELS-1){
      ctx.save(); ctx.strokeStyle='#181828'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(rx+cW,raY); ctx.lineTo(rx+cW,raY+raH); ctx.stroke(); ctx.restore();
    }
  }
  // Payline highlights
  for(const w of sWins){
    const p=0.5+0.5*Math.sin(gNow*8);
    ctx.save(); ctx.globalAlpha=0.28*p;
    ctx.fillStyle=SYMS.find(s=>s.id===w.sym)?.col||C.gold;
    ctx.fillRect(raX,raY+w.row*cH,raW,cH); ctx.restore();
    ctx.save(); ctx.strokeStyle=C.gold; ctx.shadowColor=C.gold; ctx.shadowBlur=10;
    ctx.lineWidth=2; ctx.globalAlpha=p; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(raX,raY+w.row*cH+cH/2); ctx.lineTo(raX+raW,raY+w.row*cH+cH/2); ctx.stroke(); ctx.restore();
  }
  // Center row frame
  ctx.save(); ctx.strokeStyle=cc.col; ctx.shadowColor=cc.glow; ctx.shadowBlur=8;
  ctx.lineWidth=2; ctx.globalAlpha=0.6;
  ctx.strokeRect(raX,raY+cH,raW,cH); ctx.restore();
  // Win display
  const wdY=raY+raH+32;
  if(sWinAmt>0&&sWinTimer>0){
    ctx.save(); ctx.globalAlpha=Math.min(sWinTimer,1);
    neonText(`+${sWinAmt} CRÉDITS !`,CW/2,wdY,Math.min(SW*0.082,26),C.gold,22);
    ctx.restore(); sWinTimer-=gDt;
  }
  if(sMsg&&sMsgTimer>0){
    ctx.save(); ctx.globalAlpha=Math.min(sMsgTimer,1);
    neonText(sMsg,CW/2,wdY+(sWinAmt>0&&sWinTimer>0?34:0),Math.min(SW*0.062,18),C.kira,14);
    ctx.restore(); sMsgTimer-=gDt;
  }
  // Bet row
  const betY=sy+SH-108;
  const bBW=44, bBH=30;
  rRect(CW/2-bBW*1.65,betY,bBW,bBH,8,'rgba(8,8,25,0.9)',C.dim,0);
  neonText('−',CW/2-bBW*1.18,betY+15,17,C.white,5);
  neonText(`MISE: ${sBet}`,CW/2,betY+15,13,C.white,5);
  rRect(CW/2+bBW*0.65,betY,bBW,bBH,8,'rgba(8,8,25,0.9)',C.dim,0);
  neonText('+',CW/2+bBW*1.18,betY+15,17,C.white,5);
  sBtnMinus={x:CW/2-bBW*1.65,y:betY,w:bBW,h:bBH};
  sBtnPlus={x:CW/2+bBW*0.65,y:betY,w:bBW,h:bBH};
  // Spin button
  const spW=Math.min(SW*0.55,200), spH=54, spY=sy+SH-68;
  const canSpin=!sSpinning&&(sBonus||sCredits>=sBet);
  rRect(CW/2-spW/2,spY,spW,spH,spH/2,
    canSpin?(sBonus?'rgba(255,192,64,0.25)':'rgba(144,64,255,0.22)'):'rgba(30,30,50,0.5)',
    canSpin?(sBonus?C.gold:cc.col):'#3a3a5a',
    canSpin?20:4,
    canSpin?(sBonus?C.goldG:cc.glow):'#3a3a5a');
  neonText(sSpinning?'...':(sBonus?'★ SPIN GRATUIT':'▶ SPIN'),CW/2,spY+spH/2,
    Math.min(spH*0.38,18),canSpin?(sBonus?C.gold:cc.col):'#3a3a5a',canSpin?14:0);
  sBtnSpin={x:CW/2-spW/2,y:spY,w:spW,h:spH};
  // Back

  }

}
function rDrawCtrl(){
  if(JOY.active){ctx.save();ctx.globalAlpha=0.25;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(JOY.bx,JOY.by,JOY.rad,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=0.45;ctx.fillStyle='#a060ff';ctx.beginPath();ctx.arc(JOY.tx,JOY.ty,20,0,Math.PI*2);ctx.fill();ctx.restore();}
  else{ctx.save();ctx.globalAlpha=0.08;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(80,VH-80,JOY.rad,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
  const bdefs=[{k:'slash',col:'#a060ff',glw:'#c080ff'},{k:'shoot',col:'#40c0e0',glw:'#00aacc'},{k:'dash',col:'#8040ff',glw:'#a060ff'},{k:'heal',col:'#40ff80',glw:'#20cc60'}];
  for(const d of bdefs){
    const btn=RBTNS[d.k];
    const cdV=d.k==='dash'?rPlayer.dashCd:d.k==='heal'?rPlayer.healCd:rPlayer.atkCd;
    const cdM=d.k==='dash'?rPlayer.dashCd2:d.k==='heal'?1.5:0.35;
    const rdy=cdV<=0;
    ctx.save();ctx.globalAlpha=rdy?0.75:0.35;ctx.fillStyle=d.col;ctx.shadowColor=d.glw;ctx.shadowBlur=btn.active?20:10;ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,0,Math.PI*2);ctx.fill();
    if(!rdy&&cdM>0){ctx.globalAlpha=0.5;ctx.strokeStyle=d.glw;ctx.lineWidth=3;ctx.shadowBlur=0;ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-cdV/cdM));ctx.stroke();}
    ctx.globalAlpha=rdy?0.9:0.5;ctx.fillStyle='#fff';ctx.shadowColor=d.glw;ctx.shadowBlur=6;ctx.font=`bold ${d.k==='slash'?18:15}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(btn.lbl,btn.x,btn.y);ctx.restore();
  }
  if(rPlayer.healCount>0){ctx.save();ctx.globalAlpha=0.8;ctx.fillStyle='#40ff80';ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('×'+rPlayer.healCount,RBTNS.heal.x+RBTNS.heal.r-2,RBTNS.heal.y-RBTNS.heal.r+2);ctx.restore();}
  // Back button
  ctx.save();ctx.globalAlpha=0.6;
  rRect(RBACK.x,RBACK.y,RBACK.w,RBACK.h,6,'rgba(8,8,20,0.8)',C.dim,3);
  ctx.fillStyle=C.dim;ctx.font='11px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('← MENU',RBACK.x+RBACK.w/2,RBACK.y+RBACK.h/2);
  ctx.restore();
}
function rDrawHUD(){
  const top=Math.max(vOY*.5+16,16),left=Math.max(vOX+14,14),orbR=9,orbG=22;
  for(let i=0;i<rPlayer.maxHp;i++){ctx.save();const full=i<rPlayer.hp;ctx.fillStyle=full?'#e03060':'#3a1a22';if(full){ctx.shadowColor='#e03060';ctx.shadowBlur=9;}ctx.beginPath();ctx.arc(left+orbR+i*orbG,top,orbR,0,Math.PI*2);ctx.fill();ctx.restore();}
  const aX=left+rPlayer.maxHp*orbG+14;
  for(let i=0;i<rPlayer.maxAmmo;i++){ctx.save();const full=i<rPlayer.ammo;ctx.fillStyle=full?'#40c0e0':'#1a2a30';if(full){ctx.shadowColor='#40c0e0';ctx.shadowBlur=6;}ctx.fillRect(aX+i*11,top-7,6,14);ctx.restore();}
  ctx.save();ctx.fillStyle='#ffb040';ctx.shadowColor='#ff8020';ctx.shadowBlur=8;ctx.font='bold 14px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VAGUE '+rWave,vCW/2,top);ctx.restore();
  ctx.save();ctx.fillStyle='#c0d0ff';ctx.shadowColor='#6080ff';ctx.shadowBlur=8;ctx.font='13px Courier New';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(rScore,vCW-Math.max(vOX,0)-14,top);ctx.restore();
}
function rDrawOverlay(){
  const fh=Math.round(vCH*.09),sh=Math.round(vCH*.045),sm=Math.round(vCH*.032);
  if(rWaveTr){
    const t=1-rWaveTrTimer/2;ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI)*.85;ctx.fillStyle='#000';ctx.fillRect(0,0,vCW,vCH);ctx.restore();
    ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI);ctx.fillStyle=PAL.heal;ctx.shadowColor=PAL.heal;ctx.shadowBlur=30;ctx.font=`bold ${fh}px Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VAGUE '+rWave+' TERMINÉE',vCW/2,vCH/2-sh);ctx.font=`${sm}px Courier New`;ctx.fillStyle='#c0d0ff';ctx.shadowColor='#6080ff';ctx.fillText('+'+(rWave*200)+' pts',vCW/2,vCH/2+sm);ctx.restore();
  }
  if(rGameState==='dead'){
    ctx.save();ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,vCW,vCH);
    ctx.fillStyle='#e03060';ctx.shadowColor='#e03060';ctx.shadowBlur=40;ctx.font=`bold ${fh}px Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GAME OVER',vCW/2,vCH/2-sh);
    ctx.font=`${sh}px Courier New`;ctx.fillStyle='#c0d0ff';ctx.shadowColor='#6080ff';ctx.shadowBlur=10;ctx.fillText('SCORE: '+rScore,vCW/2,vCH/2+sm);
    ctx.font=`${sm}px Courier New`;ctx.fillStyle='#5a5a8a';ctx.shadowBlur=0;ctx.fillText('Appuie pour rejouer',vCW/2,vCH/2+sh*1.8);ctx.restore();
  }
  if(rGameState==='win'){
    ctx.save();ctx.fillStyle='rgba(0,0,20,0.8)';ctx.fillRect(0,0,vCW,vCH);
    ctx.fillStyle=PAL.heal;ctx.shadowColor=PAL.heal;ctx.shadowBlur=40;ctx.font=`bold ${fh}px Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('VICTOIRE !',vCW/2,vCH/2-sh);
    ctx.font=`${sh}px Courier New`;ctx.fillStyle='#c0d0ff';ctx.shadowColor='#6080ff';ctx.shadowBlur=10;ctx.fillText('SCORE: '+rScore,vCW/2,vCH/2+sm);
    ctx.font=`${sm}px Courier New`;ctx.fillStyle='#5a5a8a';ctx.shadowBlur=0;ctx.fillText('Appuie pour rejouer',vCW/2,vCH/2+sh*1.8);ctx.restore();
  }
}
function rRestart(){
  Object.assign(rPlayer,{x:VW/2,y:VH/2,hp:5,ammo:8,ammoRegen:0,dashCd:0,dashDur:0,inv:0,atkCd:0,healCd:0,healCount:2,trail:[]});
  rPlayer.facing={x:1,y:0};
  rParticles=[];rBullets=[];rEBullets=[];rSlash=null;rShake=0;rScore=0;rWave=1;rGameState='playing';rWaveTr=false;
  rSpawnWave(1);
}
function startRPG(){
  rpgResize(); rRestart(); PAL.playerGlow=CHARS[selChar].col; STATE='rpg';
}

// ── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const{clientX:cx,clientY:cy}=t;
    if(STATE==='menu'){ menuTouch(cx,cy); continue; }
    if(STATE==='slot'){ slotTouch(cx,cy); continue; }
    if(STATE==='rpg'){
      const{x:gx,y:gy}=toGame(cx,cy);
      // Back button
      if(inBox(gx,gy,{x:RBACK.x,y:RBACK.y,w:RBACK.w,h:RBACK.h})){STATE='menu';continue;}
      let hitBtn=false;
      for(const[n,btn]of Object.entries(RBTNS)){
        if(rInBtn(btn,gx,gy)&&btn.tid===null){
          btn.tid=t.identifier;btn.active=true;hitBtn=true;
          if(n==='slash')rMelee();if(n==='shoot')rFire();if(n==='dash')rDash(JOY.dx,JOY.dy);if(n==='heal')rHeal();
          break;
        }
      }
      if(hitBtn)continue;
      if(gx<VW*.55&&!JOY.active){JOY.active=true;JOY.tid=t.identifier;JOY.bx=gx;JOY.by=gy;JOY.tx=gx;JOY.ty=gy;JOY.dx=0;JOY.dy=0;}
      if((rGameState==='dead'||rGameState==='win')&&gx>VW*.25&&gx<VW*.75&&gy>VH*.35&&gy<VH*.65)rRestart();
    }
  }
},{passive:false});
document.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(STATE==='rpg'&&t.identifier===JOY.tid){
      const{x:gx,y:gy}=toGame(t.clientX,t.clientY);
      const dx=gx-JOY.bx,dy=gy-JOY.by,dist=Math.hypot(dx,dy),cl=Math.min(dist,JOY.rad),ang=Math.atan2(dy,dx);
      JOY.tx=JOY.bx+Math.cos(ang)*cl;JOY.ty=JOY.by+Math.sin(ang)*cl;
      JOY.dx=dist>8?Math.cos(ang):0;JOY.dy=dist>8?Math.sin(ang):0;
    }
  }
},{passive:false});
document.addEventListener('touchend', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===JOY.tid){JOY.active=false;JOY.tid=null;JOY.dx=0;JOY.dy=0;}
    for(const btn of Object.values(RBTNS)){if(btn.tid===t.identifier){btn.tid=null;btn.active=false;}}
  }
},{passive:false});
document.addEventListener('keydown', e=>{
  rKeys[e.code]=true;
  if(STATE==='rpg'){
    if(e.code==='Space'){rMelee();e.preventDefault();}
    if(e.code==='Escape'){STATE='menu';}
    if(e.code==='ShiftLeft'||e.code==='ShiftRight'){const mx=(rKeys['KeyA']||rKeys['KeyQ']||rKeys['ArrowLeft']?-1:0)+(rKeys['KeyD']||rKeys['ArrowRight']?1:0);const my=(rKeys['KeyW']||rKeys['KeyZ']||rKeys['ArrowUp']?-1:0)+(rKeys['KeyS']||rKeys['ArrowDown']?1:0);rDash(mx,my);}
    if(e.code==='KeyF')rHeal();
  }
  if(STATE==='slot'&&e.code==='Space')spinSlot();
  if(e.code==='Escape'&&STATE!=='menu')STATE='menu';
});
document.addEventListener('keyup', e=>{rKeys[e.code]=false;});
canvas.addEventListener('click', e=>{
  if(STATE==='rpg'){const{x,y}=toGame(e.clientX,e.clientY);if((rGameState==='dead'||rGameState==='win')&&x>VW*.25&&x<VW*.75&&y>VH*.35&&y<VH*.65)rRestart();else rMelee();}
});
canvas.addEventListener('contextmenu', e=>{e.preventDefault();if(STATE==='rpg')rFire();});

// ── Main loop ────────────────────────────────────────────────────────────────
function loop(ts){
  gDt=Math.min((ts-gLast)/1000,0.05);gLast=ts;gNow+=gDt;
  if(STATE==='menu') drawMenu();
  else if(STATE==='slot'){ updateSlot(); drawSlot(); }
  else if(STATE==='rpg'){ rUpdate(gDt); rDraw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{gLast=ts;requestAnimationFrame(loop);});
</script>
